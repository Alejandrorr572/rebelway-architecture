services:
  artists-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5431:5432" 

  artists-app:
    build: .
    ports:
      - "4001:4001"
    env_file:
      - .env 
    depends_on:
      - artists-db