services:
  artists-db:
    image: postgres:15-alpine
    container_name: rebelway-artists-db
    ports:
      - "5432:5432"
    env_file:
      - ./services/artist-service/.env
    volumes:
      - artists-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  songs-db:
    image: postgres:15-alpine
    container_name: rebelway-songs-db
    ports:
      - "5433:5432"
    env_file:
      - ./services/song-service/.env
    volumes:
      - songs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the pending migrations once before the service starts (same role as the Kubernetes initContainer)
  artist-migrations:
    build:
      context: .
      dockerfile: services/artist-service/Dockerfile
    container_name: rebelway-artist-migrations
    command: ["npm", "run", "migration:run"]
    env_file:
      - ./services/artist-service/.env
    environment:
      - DB_SSL=false
    depends_on:
      artists-db:
        condition: service_healthy

  artist-service:
    build:
      context: .
      dockerfile: services/artist-service/Dockerfile
    container_name: rebelway-artist-service
    ports:
      - "4001:4001"
    env_file:
      - ./services/artist-service/.env
    environment:
      - PORT=4001
      - DB_SSL=false
    depends_on:
      artist-migrations:
        condition: service_completed_successfully

  song-migrations:
    build:
      context: .
      dockerfile: services/song-service/Dockerfile
    container_name: rebelway-song-migrations
    command: ["npm", "run", "migration:run"]
    env_file:
      - ./services/song-service/.env
    environment:
      - DB_SSL=false
    depends_on:
      songs-db:
        condition: service_healthy

  song-service:
    build:
      context: .
      dockerfile: services/song-service/Dockerfile
    container_name: rebelway-song-service
    ports:
      - "4002:4002"
    env_file:
      - ./services/song-service/.env
    environment:
      - PORT=4002
      - DB_SSL=false
    depends_on:
      song-migrations:
        condition: service_completed_successfully

volumes:
  artists-data:
  songs-data:
