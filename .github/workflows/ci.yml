name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Tests with Coverage
      run: |
        npx jest --coverage \
          --coverageThreshold='{"global":{"lines":80,"statements":80,"functions":80,"branches":80}}' \
          --coverageReporters="json-summary" \
          --coverageReporters="text"

    - name: Generate Coverage Badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        # Extract coverage percentage from json-summary
        COVERAGE=$(node -e "const summary = require('./coverage/coverage-summary.json'); console.log(Math.round(summary.total.lines.pct));")
        echo "Coverage: $COVERAGE%"
        
        # Determine badge color based on percentage
        if [ "$COVERAGE" -ge 80 ]; then
          COLOR="success"
        else
          COLOR="critical"
        fi
        
        # Download the badge from shields.io
        mkdir -p badges
        curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > badges/coverage.svg
        
    - name: Commit and push badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add badges/coverage.svg
        git commit -m "docs: update coverage badge [skip ci]" || echo "No changes to commit"
        git push

